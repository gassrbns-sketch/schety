<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>Счёты</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <button id="back" class="icon" aria-label="Назад" hidden>‹</button>
    <h1 id="title">Счёты</h1>
    <span id="sync" class="sync"></span>
    <button id="gear" class="icon" aria-label="Настройки">⚙</button>
  </header>
  <main id="view"></main>
  <div id="timer" class="timer" hidden>
    <span id="timer-left"></span>
    <button id="timer-add">+30 с</button>
    <button id="timer-stop">стоп</button>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="sheet-bg" class="sheet-bg" hidden></div>
  <section id="sheet" class="sheet" hidden></section>
  <script src="app.js"></script>
</body>
</html>
